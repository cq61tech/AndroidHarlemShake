name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HarlemShake-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HarlemShake.apk
          gh release create "build-${{ github.run_number }}" HarlemShake.apk --target "${{ github.sha }}" --title "build-${{ github.run_number }}" --notes "HarlemShake apk"
